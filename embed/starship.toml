# ABOUTME: Minimal Starship prompt configuration for devcontainer environments.
# ABOUTME: Keeps the prompt fast and uncluttered with essential context only.

format = """$directory$git_branch$git_status$character"""

[directory]
truncation_length = 3

[git_branch]
format = "[$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
